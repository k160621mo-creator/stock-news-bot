name: 0050 Daily News Schedule

on:
  schedule:
    # 1. 台灣時間 11:30 (即 UTC 3:30) 推送早盤快報
    - cron: '30 3 * * *'
    # 2. 台灣時間 14:30 (即 UTC 6:30) 推送收盤統整
    - cron: '30 6 * * *'
  workflow_dispatch: # 支援手動測試

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run Morning Session (11:30)
        if: github.event.schedule == '30 3 * * *' || github.event_name == 'workflow_dispatch'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py "早盤 11:30 戰情快報"

      - name: Run Afternoon Session (14:30)
        if: github.event.schedule == '30 6 * * *'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py "下午 14:30 收盤統整"
